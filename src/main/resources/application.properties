spring.application.name=insurance
server.port=8082
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HealthInsuranceDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#spring.jpa.hibernate.ddl-auto=truncate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
#spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

spring.web.resources.static-locations=classpath:/static/,file:${file.upload-dir}/

spring.thymeleaf.cache=false
logging.level.org.springframework.security=DEBUG

server.error.whitelabel.enabled=false

logging.level.root=WARN
logging.level.com.pg91=DEBUG
logging.level.org.springframework = INFO

#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate=DEBUG

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql=TRACE