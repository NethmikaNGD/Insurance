<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - HealthSure Lanka</title>
    <link rel="stylesheet" th:href="@{/css/indexcss.css}">
    <link rel="stylesheet" th:href="@{/css/nav.css}">

    <style>
        .login-container {
            text-align: center;
            padding: 50px;
            max-width: 400px;
            margin: 50px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input {
            width: 95%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .alert-error {
            color: #D8000C;
            background-color: #FFD2D2;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>

</head>
<body>
<nav th:replace="~{home :: nav}"></nav>

<div class="login-container" style="text-align: center; padding: 50px;">
    <h2>Login to Your Account</h2>

    <div th:if="${param.error}" class="alert-error">
        Invalid email or password.
    </div>
    <div th:if="${param.logout}" class="alert-success">
        You have been logged out.
    </div>

    <form th:action="@{/login}" method="post" style="max-width: 400px; margin: auto;">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btnactive">Log In</button>
    </form>
    <p>Don't have an account? <a th:href="@{/user/register}">Register here</a></p>
</div>

</body>
</html>
