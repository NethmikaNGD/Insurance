
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/nav.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <title>Login - HealthSure Insurance Lanka</title>
    <link rel="icon" href="img/img.png">
    <style>
        .brand { font-size: 20px; font-weight: 800; }
    </style>
</head>
<body>
<nav>
    <h2 class="navHeader"><span class="highlight">HealthSure Insurance Lanka</span></h2>
    <ul class="navLinks">
        <!-- Uncomment these if needed
        <li><a href="index.html">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
        -->
    </ul>
    <div class="getInsurance">
        <a  th:href="@{/register}"><button class="btnInsurance">Create Account</button></a>
    </div>
</nav>

<main class="auth-wrapper">
    <div class="auth-illustration"></div>
    <section class="auth-panel">
        <div class="auth-card">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Log in to manage your <span class="highlight">Insurance</span> plans.</p>

            <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='InsurancePlanPage.html'">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Your password" required>
                </div>
                <div class="auth-actions">
                    <button class="auth-btn" type="submit">Log in</button>
                    <a class="auth-link" th:href="@{/register}">No account? Register</a>
                </div>
                <p class="auth-note">Demo only. Submitting will redirect you to plans.</p>
            </form>
        </div>
    </section>
</main>
</body>
</html>
