<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/nav.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <title>Register - HealthSure Insurance Lanka</title>
    <link rel="icon" th:href="@{/css/image/img.png}">
</head>
<body>
<nav>
    <h2 class="navHeader"><span class="highlight">HealthSure Insurance Lanka</span></h2>
    <ul class="navLinks">
        <li><a th:href="@{/}">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
    <div class="getInsurance">
        <a th:href="@{/login}">
            <button class="btnInsurance">Log in</button>
        </a>
    </div>
</nav>

<main class="auth-wrapper">
    <div class="auth-illustration"></div>
    <section class="auth-panel">
        <div class="auth-card">
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Join <span class="highlight">HealthSure</span> and protect what matters.</p>

            <!-- Display flash messages -->
            <div th:if="${success}" class="alert-success" style="color: green; background-color: #d4edda; padding: 10px; margin-bottom: 15px; border-radius: 4px;">
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert-error" style="color: red; background-color: #f8d7da; padding: 10px; margin-bottom: 15px; border-radius: 4px;">
                <span th:text="${error}"></span>
            </div>

            <form class="auth-form" th:action="@{/user/register}" method="post">
                <div>
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="Jane Doe" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
                <div>
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
                </div>
                <div>
                    <label for="role">Account Type</label>
                    <select id="role" name="role">
                        <option value="CUSTOMER">Customer</option>
                        <option value="DOCTOR">Doctor</option>
                    </select>
                </div>
                <div class="auth-actions">
                    <button class="auth-btn" type="submit">Create account</button>
                    <a class="auth-link" th:href="@{/login}">Have an account? Log in</a>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
