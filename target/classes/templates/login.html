<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upload Medical Report</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Medical Report System</h1>
</header>

<nav>
    <a th:href="@{/reports}">📋 View Reports</a>
    <a th:href="@{/upload}">⬆ Upload Report</a>
    <a th:href="@{/logout}">🚪 Logout</a>
</nav>

<main class="container">
    <h2>Upload Medical Report</h2>

    <form th:action="@{/upload}" method="post" enctype="multipart/form-data" th:object="${report}" class="form-box">

        <div class="form-group">
            <label for="patientName">Patient Name</label>
            <!-- ✅ FIXED: use th:field -->
            <input type="text" id="patientName" th:field="*{patientName}" placeholder="Enter patient's full name" required>
        </div>

        <div class="form-group">
            <label for="reportType">Report Type</label>
            <!-- ✅ FIXED -->
            <input type="text" id="reportType" th:field="*{reportType}" placeholder="e.g., Blood Test, X-Ray" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <!-- ✅ FIXED -->
            <textarea id="description" th:field="*{description}" placeholder="Enter report details" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label for="file">Upload File</label>
            <input type="file" id="file" name="file" accept=".pdf,.jpg,.png,.doc,.docx" required>
        </div>

        <button type="submit" class="btn">Upload Report</button>
    </form>

</main>
</body>
</html>
