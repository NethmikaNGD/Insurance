<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medical Reports</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            background: #f8f9fa;
        }
        header {
            background: #007bff;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        nav {
            background: #343a40;
            padding: 0.5rem;
            text-align: center;
        }
        nav a {
            color: #fff;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main.container {
            padding: 2rem;
        }
        h2 {
            color: #333;
        }
        .btn {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 0.75rem;
            border: 1px solid #dee2e6;
            text-align: left;
        }
        th {
            background: #f1f1f1;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .actions a {
            margin: 0 5px;
            padding: 0.3rem 0.6rem;
            border-radius: 3px;
            text-decoration: none;
        }
        .edit-btn {
            background: #ffc107;
            color: #000;
        }
        .edit-btn:hover {
            background: #e0a800;
        }
        .delete-btn {
            background: #dc3545;
            color: white;
        }
        .delete-btn:hover {
            background: #c82333;
        }
        .message {
            margin: 1rem 0;
            padding: 0.75rem;
            border-radius: 5px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<header>
    <h1>📋 Medical Report System</h1>
</header>

<nav>
    <a th:href="@{/reports}">View Reports</a>
    <a th:href="@{/upload}">Upload Report</a>
    <a th:href="@{/logout}">Logout</a>
</nav>

<main class="container">
    <h2>All Reports</h2>

    <!-- ✅ success or delete/update messages -->
    <div th:if="${message}" class="message" th:text="${message}"></div>

    <a class="btn" th:href="@{/upload}">+ Upload New Report</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Type</th>
            <th>Description</th>
            <th>File</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reports}">
            <td th:text="${r.id}">1</td>
            <td th:text="${r.patientName}">John Doe</td>
            <td th:text="${r.reportType}">Blood Test</td>
            <td th:text="${r.description}">desc</td>
            <td>
                <a th:if="${r.fileName}" th:href="@{'/download/' + ${r.id}}" th:text="${r.fileName}">file.pdf</a>
            </td>
            <td th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}">2025-10-01</td>
            <td class="actions">
                <a th:href="@{'/edit/' + ${r.id}}" class="edit-btn">✏ Edit</a>
                <a th:href="@{'/delete/' + ${r.id}}" class="delete-btn"
                   onclick="return confirm('Are you sure you want to delete this report?')">🗑 Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
